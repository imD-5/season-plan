# XcodeGen spec: `xcodegen` in this folder writes Season.xcodeproj (git-ignored).
name: Season
options:
  bundleIdPrefix: local.season
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  SeasonCore:
    path: SeasonCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Season:
    type: application
    platform: iOS
    sources: [Season]
    dependencies:
      - package: SeasonCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SEASON_BUNDLE_ID)
        PRODUCT_NAME: Season
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Season/Info.plist
      properties:
        CFBundleDisplayName: Season
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SeasonServerURL: $(SEASON_SERVER_URL)
        NSAppTransportSecurity:
          # The Mac is reached over Tailscale HTTPS; plain http is only for 127.0.0.1 in the simulator.
          NSAllowsLocalNetworking: true
  SeasonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SeasonUITests]
    dependencies:
      - target: Season
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SEASON_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Season
schemes:
  Season:
    build:
      targets:
        Season: all
        SeasonUITests: [test]
    test:
      targets: [SeasonUITests]
